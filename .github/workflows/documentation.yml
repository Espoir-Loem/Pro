name: "Pro[CI]: documentation"

on:
  push:
    branches: [main, staging, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: read
  pull-requests: read

jobs:
  documentation:
    name: "Pro[CI]: documentation"
    runs-on: ubuntu-24.04
    steps:
      - name: "Pro[CI]: checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Pro[CI]: setup Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: "Pro[CI]: setup Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
      - name: "Pro[CI]: install dependencies"
        run: npm ci --ignore-scripts
      - name: "Pro[CI]: configure identity"
        run: |
          git config user.name "Pro[CI]"
          git config user.email "pro-ci@users.noreply.github.com"
      - name: "Pro[CI]: Python tests"
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: "Pro[CI]: KPI coverage"
        run: python3 scripts/check_kpi.py
      - name: "Pro[CI]: pull request issue"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_pr_issue.py "$PR_NUMBER"
      - name: "Pro[CI]: repository check"
        run: npm run check
      - name: "Pro[CI]: secrets"
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          mkdir -p .tmp
          curl -fsSL -o ".tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o .tmp/gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd .tmp && grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf ".tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C .tmp
          .tmp/gitleaks detect --no-git --redact --source .
      - name: "Pro[CI]: SCA"
        env:
          OSV_VERSION: "2.7.1"
        run: |
          curl -fsSL -o .tmp/osv-scanner_linux_amd64 "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -fsSL -o .tmp/osv-scanner_SHA256SUMS "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_SHA256SUMS"
          (cd .tmp && grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -)
          chmod +x .tmp/osv-scanner_linux_amd64
          .tmp/osv-scanner_linux_amd64 scan --lockfile package-lock.json --format json --output .tmp/osv-results.json
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); n=sum(len(r.get("vulnerabilities", [])) for r in d.get("results", [])); print("vulnerabilites:", n); sys.exit(1 if n else 0)' .tmp/osv-results.json
      - name: "Pro[CI]: SAST"
        run: |
          python3 -m venv .tmp/semgrep-env
          .tmp/semgrep-env/bin/pip install --disable-pip-version-check -q semgrep==1.187.0
          .tmp/semgrep-env/bin/semgrep scan --config scripts/semgrep-rules.yml --error --metrics=off --exclude=node_modules --exclude=.tmp --quiet .
      - name: "Pro[CI]: licenses"
        run: npx --yes --package=license-checker-rseidelsohn@5.0.1 license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense;CC0-1.0'
      - name: "Pro[CI]: SBOM"
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          format: cyclonedx-json
          path: .
          output-file: sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false
          upload-release-assets: false
      - name: "Pro[CI]: install cosign"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6
      - name: "Pro[CI]: sign SBOM"
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign-blob --yes --output-signature .tmp/sbom.cdx.json.sig --output-certificate .tmp/sbom.cdx.json.pem sbom.cdx.json
      - name: "Pro[CI]: VEX"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          stamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          document = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.7",
              "version": 1,
              "metadata": {
                  "timestamp": stamp,
                  "authors": [{"name": "Espoir LOEMBA", "email": "hopcy.forcy@gmail.com"}],
                  "component": {"type": "application", "name": "Pro", "version": "${GITHUB_REF_NAME}"},
              },
              "vulnerabilities": [],
          }
          with open("vex.cdx.json", "w", encoding="utf-8") as handle:
              json.dump(document, handle, ensure_ascii=False, indent=2)
          PY
          cosign sign-blob --yes --output-signature .tmp/vex.cdx.json.sig --output-certificate .tmp/vex.cdx.json.pem vex.cdx.json
      - name: "Pro[CI]: release assets"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="sbom.cdx.json vex.cdx.json .tmp/sbom.cdx.json.sig .tmp/sbom.cdx.json.pem .tmp/vex.cdx.json.sig .tmp/vex.cdx.json.pem"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" $assets --clobber
          else
            gh release create "${GITHUB_REF_NAME}" $assets --generate-notes --verify-tag
          fi
